<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trắc nghiệm Kinh tế Chính trị Mác - Lênin (Ngẫu nhiên)</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
            --success-color: #2ecc71;
            --error-color: #e74c3c;
            --border-color: #e0e0e0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px;
            background: linear-gradient(135deg, #e67e22, #d35400);
            color: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            margin: 0;
            font-size: 24px;
        }

        .quiz-info {
            margin-top: 10px;
            font-size: 14px;
            opacity: 0.9;
        }

        .question-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
            transition: transform 0.2s;
        }

        .question-card:hover {
            transform: translateY(-2px);
        }

        .question-text {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 15px;
            color: var(--primary-color);
        }

        .options-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        .option-item {
            padding: 12px 15px;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s ease;
            font-size: 15px;
            background-color: #fff;
        }

        .option-item:hover {
            background-color: #f1f3f5;
            border-color: #b1babc;
        }

        /* Các trạng thái màu sắc khi click */
        .option-item.correct {
            background-color: #d4edda !important;
            border-color: var(--success-color) !important;
            color: #155724 !important;
            font-weight: 600;
            pointer-events: none; /* Đúng rồi thì khóa câu này lại */
        }

        .option-item.wrong {
            background-color: #f8d7da !important;
            border-color: var(--error-color) !important;
            color: #721c24 !important;
            pointer-events: none; /* Sai rồi thì không cho bấm lại chính nút sai này nữa */
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>TRẮC NGHIỆM KINH TẾ CHÍNH TRỊ (100 CÂU)</h1>
        <div class="quiz-info">🔄 Câu hỏi tự động đảo ngẫu nhiên khi tải lại trang | 🎯 Bạn có thể chọn lại đáp án cho đến khi đúng!</div>
    </header>

    <div id="quiz-container"></div>
</div>

<script>
    // Dữ liệu gốc 100 câu hỏi
    const originalQuizData = [
        { q: "Thuật ngữ \"kinh tế- chính trị\" được sử dụng lần đầu tiên vào năm nào?", a: ["1610", "1612", "1615", "1618"], r: 2 },
        { q: "Ai là người đầu tiên đưa ra khái niệm \"kinh tế- chính trị\"?", a: ["Antoine Montchrétien", "Francois Quesnay", "Tomas Mun", "William Petty"], r: 0 },
        { q: "Ai là người được C. Mác coi là sáng lập ra kinh tế chính trị tư sản cổ điển?", a: ["A. Smith", "D. Ricardo", "W.Petty", "R.T.Mathus"], r: 2 },
        { q: "Ai là người được coi là nhà kinh tế thời kỳ công trường thủ công?", a: ["W. Petty", "A. Smith", "D.Ricardo", "R.T.Mathus"], r: 1 },
        { q: "D.Ricardo là nhà kinh tế của thời kỳ nào?", a: ["Thời kỳ tích luỹ nguyên thuỷ TBCN", "Thời kỳ hiệp tác giản đơn", "Thời kỳ công trường thủ công", "Thời kỳ đại công nghiệp cơ khí"], r: 3 },
        { q: "Kinh tế- chính trị Mác - Lênin đã kế thừa và phát triển trực tiếp những thành tựu của:", a: ["Chủ nghĩa trọng thương", "Chủ nghĩa trọng nông", "Kinh tế chính trị cổ điển Anh", "Kinh tế- chính trị tầm thường"], r: 2 },
        { q: "Học thuyết kinh tế nào của C.Mác được coi là hòn đá tảng?", a: ["Học thuyết giá trị lao động", "Học thuyết giá trị thặng dư", "Học thuyết tích luỹ tư sản", "Học thuyết tái sản xuất tư bản xã hội"], r: 1 },
        { q: "Đối tượng nghiên cứu của kinh tế- chính trị Mác-Lênin là:", a: ["Sản xuất của cải vật chất", "Quan hệ xã hội giữa người với người", "Quan hệ sản xuất trong mối quan hệ tác động qua lại với lực lượng sản xuất và kiến trúc thượng tầng.", "Quá trình sản xuất, phân phối, trao đổi, tiêu dùng."], r: 2 },
        { q: "Hãy chọn phương án đúng về đặc điểm của quy luật kinh tế:", a: ["Mang tính khách quan", "Mang tính chủ quan", "Phát huy tác dụng thông qua hoạt động kinh tế của con người", "Cả a và c"], r: 3 },
        { q: "Chọn phương án đúng về quy luật kinh tế và chính sách kinh tế:", a: ["Quy luật kinh tế là cơ sở của chính sách kinh tế", "Chính sách kinh tế là hoạt động chủ quan của nhà nước trên cơ sở nhận thức và vận dụng các quy luật khách quan.", "Quy luật kinh tế và chính sách kinh tế đều phụ thuộc vào các điều kiện khách quan.", "Cả a, b, c"], r: 3 },
        { q: "Để nghiên cứu kinh tế- chính trị Mác- Lênin có thể sử dụng nhiều phương pháp, phương pháp nào quan trọng nhất?", a: ["Trừu tượng hoá khoa học", "Phân tích và tổng hợp", "Mô hình hoá", "Điều tra thống kê"], r: 0 },
        { q: "Khi nghiên cứu phương thức sản xuất TBCN, C.Mác bắt đầu từ:", a: ["Sản xuất của cải vật chất", "Lưu thông hàng hoá", "Sản xuất giá trị thặng dư", "Sản xuất hàng hoá giản đơn và hàng hoá"], r: 3 },
        { q: "Trừu tượng hoá khoa học là:", a: ["Gạt bỏ những bộ phận phức tạp của đối tượng nghiên cứu.", "Gạt bỏ các hiện tượng ngẫu nhiên, bề ngoài, chỉ giữ lại những mối liên hệ phổ biến mang tính bản chất.", "Quá trình đi từ cụ thể đến trừu tượng và ngược lại.", "Cả b và c"], r: 3 },
        { q: "Chức năng nhận thức của kinh tế- chính trị là nhằm:", a: ["Phát hiện bản chất của các hiện tượng và quá trình kinh tế.", "Sự tác động giữa quan hệ sản xuất với lực lượng sản xuất và kiến trúc thượng tầng.", "Tìm ra các quy luật kinh tế", "Cả a, b, c"], r: 3 },
        { q: "Chức năng phương pháp luận của kinh tế- chính trị Mác- Lênin thể hiện ở:", a: ["Trang bị phương pháp để xem xét thế giới nói chung", "Là nền tảng lý luận cho các khoa học kinh tế ngành", "Là cơ sở lý luận cho các khoa học nằm giáp ranh giữa các tri thức các ngành khác nhau.", "Cả b và c"], r: 3 },
        { q: "Chức năng tư tưởng của kinh tế- chính trị Mác – Lê nin thể hiện ở:", a: ["Góp phần xây dựng thế giới quan cách mạng của giai cấp công nhân", "Tạo niềm tin vào thắng lợi trong cuộc đấu tranh xoá bỏ áp bức bóc lột", "Là vũ khí tư tưởng của giai cấp công nhân và nhân dân lao động trong công cuộc xây dựng CNXH", "Cả a, b và c"], r: 3 },
        { q: "Bản chất khoa học và cách mạng của kinh tế - chính trị Mác- Lênin thể hiện ở chức năng nào?", a: ["Nhận thức", "Tư tưởng", "Phương pháp luận", "Cả a, b và c"], r: 3 },
        { q: "Hoạt động nào của con người được coi là cơ bản nhất và là cơ sở của đời sống xã hội?", a: ["Hoạt động chính trị", "Hoạt động khoa học", "Hoạt động sản xuất của cải vật chất", "Hoạt động nghệ thuật, thể thao"], r: 2 },
        { q: "Để xem xét, giải thích nguồn gốc sâu xa của các hiện tượng kinh tế- xã hội phải xuất phát từ:", a: ["Từ hệ tư tưởng của giai cấp thống trị", "Từ các hoạt động kinh tế", "Từ truyền thống lịch sử", "Từ ý thức xã hội"], r: 1 },
        { q: "Quá trình sản xuất là sự kết hợp của các yếu tố:", a: ["Sức lao động với công cụ lao động", "Lao động với tư liệu lao động", "Sức lao động với đối tượng lao động và tư liệu lao động", "Lao động với đối tượng lao động và tư liệu lao động"], r: 2 },
        { q: "\"Những thời đại kinh tế khác nhau không phải ở chỗ chúng sản xuất ra cái gì, mà là ở chỗ chúng sản xuất bằng cách nào, với những tư liệu lao động nào\". Câu nói trên là của ai?", a: ["A. Smith", "D.Ricardo", "C.Mác", "Ph.Ăng ghen"], r: 2 },
        { q: "Sức lao động là:", a: ["Toàn bộ thể lực và trí lực trong một con người đang sống và được vận dụng để sản xuất ra giá trị sử dụng nào đó.", "Khả năng lao động, được tiêu dùng trong quá trình sản xuất.", "Hoạt động có mục đích của con người để tạo ra của cải.", "Cả a và b."], r: 3 },
        { q: "Lao động sản xuất có đặc trưng cơ bản là:", a: ["Hoạt động cơ bản nhất, là phẩm chất đặc biệt của con người", "Là hoạt động có mục đích, có ý thức của con người", "Là sự tiêu dùng sức lao động trong hiện thực", "Cả a, b và c"], r: 3 },
        { q: "Lao động sản xuất có vai trò gì đối với con người?", a: ["Tạo ra của cải vật chất để nuôi sống con người", "Phát triển, hoàn thiện con người cả về thể lực và trí lực", "Giúp con người tích luỹ kinh nghiệm, chế tạo ra công cụ sản xuất ngày càng tinh vi", "Cả a, b, c."], r: 3 },
        { q: "Đối tượng lao động là:", a: ["Các vật có trong tự nhiên", "Những vật mà lao động của con người tác động vào nhằm thay đổi nó cho phù hợp với mục đích của con người", "Những vật dùng để truyền dẫn sức lao động của con người", "Cả a, b, c"], r: 1 },
        { q: "Chọn ý đúng trong các ý dưới đây:", a: ["Mọi nguyên liệu đều là đối tượng lao động", "Mọi đối tượng lao động đều là nguyên liệu", "Nguyên liệu là đối tượng lao động của các ngành công nghiệp chế biến", "Cả a và c đều đúng."], r: 2 },
        { q: "Tư liệu lao động gồm có:", a: ["Công cụ lao động", "Các vật để chứa đựng, bảo quản", "Kết cấu hạ tầng sản xuất", "Cả a, b, c"], r: 3 },
        { q: "Trong tư liệu lao động, bộ phận nào quyết định đến năng suất lao động?", a: ["Công cụ lao động", "Nguyên vật liệu cho sản xuất", "Các vật chứa đựng, bảo quản", "Kết cấu hạ tầng sản xuất"], r: 0 },
        { q: "Bộ phận nào của tư liệu lao động được coi là tiêu chí phản ánh đặc trưng phát triển của một thời đại kinh tế", a: ["Công cụ lao động", "Kết cấu hạ tầng sản xuất", "Nhà cửa, kho bãi ... để chứa đựng, bảo quản", "Cả a và b"], r: 0 },
        { q: "Chọn ý đúng trong các ý dưới đây:", a: ["Một vật là đối tượng lao động cũng có thể là tư liệu lao động", "Một vật là tư liệu lao động cũng có thể là đối tượng lao động", "Đối tượng lao động và tư liệu lao động kết hợp với nhau là tư liệu sản xuất", "Cả a, b, c đều đúng"], r: 3 },
        { q: "Trong tư liệu lao động, bộ phận nào cần được phát triển đi trước một bước so với đầu tư sản xuất trực tiếp?", a: ["Công cụ sản xuất", "Các bộ phận chứa đựng, bảo quản", "Kết cấu hạ tầng sản xuất", "Cả a và c"], r: 2 },
        { q: "Trong nền sản xuất lớn hiện đại, yếu tố nào giữ vai trò quyết định của quá trình lao động sản xuất?", a: ["Sức lao động", "Tư liệu sản xuất hiện đại", "Công cụ sản xuất tiên tiến", "Đối tượng lao động"], r: 0 },
        { q: "Phương thức sản xuất là sự thống nhất của:", a: ["Tồn tại xã hội và ý thức xã hội", "Cơ sở hạ tầng và kiến trúc thượng tầng", "Lực lượng sản xuất và quan hệ sản xuất", "Cơ cấu kinh tế và kết cấu giai cấp xã hội"], r: 2 },
        { q: "Lực lượng sản xuất biểu hiện:", a: ["Quan hệ con người với tự nhiên", "Quan hệ con người với con người", "Quan hệ con người với tự nhiên và quan hệ người với người", "Cả a, b, c"], r: 0 },
        { q: "Trong thời đại ngày nay, lực lượng sản xuất bao gồm các yếu tố nào?", a: ["Người lao động", "Tư liệu sản xuất", "Khoa học công nghệ", "Cả a, b, c"], r: 3 },
        { q: "Yếu tố chủ thể của lực lượng sản xuất là:", a: ["Tư liệu sản xuất hiện đại", "Con người với kỹ năng, kỹ xảo và tri thức được tích luỹ lại", "Khoa học công nghệ tiên tiến", "Cả b và c"], r: 1 },
        { q: "Quan hệ sản xuất biểu hiện:", a: ["Quan hệ giữa người với tự nhiên", "Quan hệ kinh tế giữa người với người trong quá trình sản xuất", "Quan hệ giữa người với người trong xã hội", "Cả a, b, c"], r: 1 },
        { q: "Quan hệ sản xuất bao gồm:", a: ["Quan hệ về sở hữu tư liệu sản xuất", "Quan hệ về tổ chức quản lý sản xuất xã hội", "Quan hệ về phân phối sản phẩm xã hội", "Cả a, b, c"], r: 3 },
        { q: "Quan hệ nào giữ vai trò quyết định trong quan hệ sản xuất:", a: ["Quan hệ sở hữu", "Quan hệ tổ chức quản lý", "Quan hệ phân phối", "Không quan hệ nào quyết định"], r: 0 },
        { q: "Quan hệ sản xuất được hình thành do:", a: ["ý muốn chủ quan của con người", "Do giai cấp thống trị quy định thành pháp luật", "Do tính chất và trình độ phát triển của lực lượng sản xuất", "Cả a, b, c"], r: 2 },
        { q: "Lực lượng sản xuất và quan hệ sản xuất có quan hệ với nhau thế nào?", a: ["Tác động qua lại với nhau", "Lực lượng sản xuất quyết định quan hệ sản xuất", "QHSX có tác động tích cực trở lại đối với lực lượng sản xuất", "Cả a, b và c"], r: 3 },
        { q: "Khi nào QHSX được xem là phù hợp với tính chất và trình độ phát triển của lực lượng sản xuất?", a: ["Thúc đẩy lực lượng sản xuất phát triển", "Cải thiện đời sống nhân dân", "Tạo điều kiện thực hiện công bằng xã hội", "Cả a, b, c"], r: 3 },
        { q: "Các phương thức sản xuất nối tiếp nhau trong lịch sử theo trình tự nào?", a: ["Cộng sản nguyên thuỷ- phong kiến- chiếm hữu nô lệ- tư bản – chủ nghĩa cộng sản", "Cộng sản nguyên thuỷ- chiếm hữu nô lệ- phong kiến- tư bản- chủ nghĩa cộng sản", "Chiếm hữu nô lệ - cộng sản nguyên thuỷ - phong kiến - tư bản - chủ nghĩa cộng sản", "Cộng sản nguyên thuỷ - chiếm hữu nô lệ - tư bản - phong kiến - chủ nghĩa cộng sản"], r: 1 },
        { q: "Tái sản xuất là:", a: ["Là quá trình sản xuất", "Là quá trình sản xuất được lặp đi lặp lại và phục hồi không ngừng.", "Là sự khôi phục lại sản xuất", "Cả a, b, c"], r: 1 },

        { q: "Lao động trừu tượng là gì?", a: ["Là lao động không cụ thể", "Là lao động phức tạp", "Là lao động có trình độ cao, mất nhiều công đào tạo", "Là sự hao phí sức lao động của người sản xuất hàng hoá nói chung không tính đến những hình thức cụ thể."], r: 3 },
        { q: "Lao động trừu tượng là nguồn gốc:", a: ["Của tính hữu ích của hàng hoá", "Của giá trị hàng hoá", "Của giá trị sử dụng", "Cả a, b, c"], r: 1 },
        { q: "Thế nào là lao động giản đơn?", a: ["Là lao động làm công việc đơn giản", "Là lao động làm ra các hàng hoá chất lượng không cao", "Là lao động chỉ làm một công đoạn của quá trình tạo ra hàng hoá.", "Là lao động không cần qua đào tạo, huấn luyện cũng có thể làm được."], r: 3 }
    ];

    // Thuật toán đảo ngẫu nhiên mảng câu hỏi (Fisher-Yates)
    const shuffleArray = (array) => {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    };

    // Tạo một bản sao và đảo ngẫu nhiên
    const quizData = shuffleArray([...originalQuizData]);

    const container = document.getElementById('quiz-container');

    quizData.forEach((item, qIdx) => {
        const card = document.createElement('div');
        card.className = 'question-card';

        const qText = document.createElement('div');
        qText.className = 'question-text';
        qText.innerText = `Câu ${qIdx + 1}: ${item.q}`;
        card.appendChild(qText);

        const uList = document.createElement('ul');
        uList.className = 'options-list';

        const labels = ['A', 'B', 'C', 'D'];
        item.a.forEach((ans, aIdx) => {
            const li = document.createElement('li');
            li.className = 'option-item';
            li.innerText = `${labels[aIdx]}. ${ans}`;
            
            li.addEventListener('click', () => {
                if (aIdx === item.r) {
                    // Nếu đúng: Tìm tất cả đáp án trong câu này, xóa màu đỏ cũ (nếu có) và tô xanh đáp án đúng
                    const siblings = uList.querySelectorAll('.option-item');
                    siblings.forEach(el => {
                        el.classList.remove('wrong');
                        el.classList.add('disabled'); // Khóa câu này lại sau khi đã tìm ra đáp án đúng
                    });
                    li.classList.add('correct');
                } else {
                    // Nếu sai: Chỉ biến nút vừa bấm thành màu đỏ, người dùng vẫn có thể bấm nút khác
                    li.classList.add('wrong');
                }
            });

            uList.appendChild(li);
        });

        card.appendChild(uList);
        container.appendChild(card);
    });
</script>
